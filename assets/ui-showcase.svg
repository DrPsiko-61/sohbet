<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="auto" style="background:#090a10;border-radius:14px;overflow:hidden;box-shadow:0 25px 60px -15px rgba(0,0,0,0.8);">
  <defs>
    <linearGradient id="winBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#0d0e14"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c29"/>
      <stop offset="100%" stop-color="#13141f"/>
    </linearGradient>
    <linearGradient id="botEmbed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2619"/>
      <stop offset="100%" stop-color="#0a1a11"/>
    </linearGradient>
    <linearGradient id="musicWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1db954"/>
      <stop offset="100%" stop-color="#2ee56b"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="1200" height="700" fill="url(#winBg)"/>
  <rect x="0.5" y="0.5" width="1199" height="699" rx="14" fill="none" stroke="#25293d" stroke-width="1"/>

  <!-- Window Titlebar -->
  <rect width="1200" height="42" fill="#0d0e15" stroke="#1d2030" stroke-width="1"/>
  <!-- Mac controls -->
  <circle cx="22" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="21" r="6" fill="#27c93f"/>
  <text x="600" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#7582a8" text-anchor="middle">
    Sohbet — Genel / #genel &amp; 🔊 Bot odası
  </text>
  <rect x="1100" y="10" width="80" height="22" rx="6" fill="#1db954" fill-opacity="0.15" stroke="#1db954" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="1114" cy="21" r="3.5" fill="#1ed760"/>
  <text x="1144" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#1ed760" text-anchor="middle">CANLI</text>

  <!-- ==================== LEFT SIDEBAR: CHANNELS ==================== -->
  <g transform="translate(0, 42)">
    <!-- Sidebar background -->
    <rect width="240" height="658" fill="#11131c" stroke="#1d2133" stroke-width="1"/>
    
    <!-- Server Title -->
    <rect width="240" height="48" fill="#151724" stroke="#1d2133" stroke-width="1"/>
    <rect x="16" y="12" width="24" height="24" rx="6" fill="#5865f2"/>
    <text x="28" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">G</text>
    <text x="48" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Genel Sunucusu</text>
    <path d="M214 22 L219 28 L224 22" fill="none" stroke="#8a95b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Category: Metin Kanalları -->
    <text x="18" y="78" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#626b89" letter-spacing="0.5">METİN KANALLARI</text>
    
    <!-- Channel: # genel (ACTIVE) -->
    <g transform="translate(10, 90)">
      <rect width="220" height="34" rx="6" fill="#202436"/>
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#8a95b8">#</text>
      <text x="32" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">genel</text>
    </g>

    <!-- Category: Ses Kanalları -->
    <text x="18" y="156" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#626b89" letter-spacing="0.5">SESLİ KANALLAR</text>

    <!-- Channel: 🔊 Sohbet (empty) -->
    <g transform="translate(10, 168)">
      <rect width="220" height="34" rx="6" fill="transparent"/>
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="13" fill="#6d7696">🔊</text>
      <text x="32" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#8a95b8">Sohbet</text>
    </g>

    <!-- Channel: 🔊 Bot odası (ACTIVE & CONNECTED) -->
    <g transform="translate(10, 208)">
      <rect width="220" height="98" rx="8" fill="#141d19" stroke="#1db954" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="13" fill="#1ed760">🔊</text>
      <text x="32" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#1ed760">Bot odası</text>
      <rect x="180" y="9" width="28" height="18" rx="9" fill="#1db954" fill-opacity="0.2"/>
      <text x="194" y="22" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#1ed760" text-anchor="middle">2</text>
      
      <!-- User 1 in room: admin -->
      <g transform="translate(20, 36)">
        <circle cx="10" cy="10" r="10" fill="#5865f2"/>
        <circle cx="10" cy="10" r="12" fill="none" stroke="#1ed760" stroke-width="2"/>
        <text x="10" y="14" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">A</text>
        <text x="30" y="14" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">admin</text>
        <rect x="74" y="4" width="40" height="14" rx="4" fill="#5865f2" fill-opacity="0.3"/>
        <text x="94" y="14" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#8a95ff" text-anchor="middle">OWNER</text>
      </g>

      <!-- User 2 in room: Müzik Botu -->
      <g transform="translate(20, 64)">
        <circle cx="10" cy="10" r="10" fill="#1db954"/>
        <text x="10" y="14" font-family="-apple-system, sans-serif" font-size="10" fill="#fff" text-anchor="middle">🎵</text>
        <text x="30" y="14" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Müzik Botu</text>
        <rect x="98" y="4" width="28" height="14" rx="4" fill="#1db954" fill-opacity="0.3"/>
        <text x="112" y="14" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#1ed760" text-anchor="middle">BOT</text>
      </g>
    </g>

    <!-- User Card at Bottom Left -->
    <g transform="translate(10, 592)">
      <rect width="220" height="52" rx="8" fill="#161824" stroke="#222638" stroke-width="1"/>
      <circle cx="26" cy="26" r="16" fill="#5865f2"/>
      <text x="26" y="31" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">A</text>
      <circle cx="36" cy="36" r="4.5" fill="#1ed760" stroke="#161824" stroke-width="2"/>
      <text x="52" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">admin</text>
      <text x="52" y="38" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#7582a8">#0001 • Çevrimiçi</text>
    </g>
  </g>

  <!-- ==================== CENTER: CHAT AREA ==================== -->
  <g transform="translate(240, 42)">
    <!-- Chat Header -->
    <rect width="760" height="48" fill="#12131b" stroke="#1d2030" stroke-width="1"/>
    <text x="24" y="29" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff"># genel</text>
    <rect x="90" y="16" width="1" height="16" fill="#2b3046"/>
    <text x="104" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#7582a8">Sohbet ve müzik komutları odası</text>

    <!-- Message 1: User '!cal' -->
    <g transform="translate(24, 72)">
      <circle cx="20" cy="20" r="18" fill="#5865f2"/>
      <text x="20" y="25" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">A</text>
      <text x="48" y="16" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">admin</text>
      <text x="96" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#626b89">Bugün 14:32</text>
      <rect x="48" y="24" width="380" height="28" rx="6" fill="#181a26"/>
      <text x="58" y="42" font-family="'Fira Code', monospace" font-size="12" fill="#00d2ff">!çal https://music.youtube.com/watch?v=dQw4w9WgXcQ</text>
    </g>

    <!-- Message 2: Bot Response Embed Card -->
    <g transform="translate(24, 140)">
      <circle cx="20" cy="20" r="18" fill="#1db954"/>
      <text x="20" y="25" font-family="-apple-system, sans-serif" font-size="14" fill="#fff" text-anchor="middle">🎵</text>
      <text x="48" y="16" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Müzik Botu</text>
      <rect x="130" y="5" width="28" height="14" rx="4" fill="#1db954" fill-opacity="0.25"/>
      <text x="144" y="15" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#1ed760" text-anchor="middle">BOT</text>
      <text x="168" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#626b89">Bugün 14:32</text>

      <!-- Music Embed Player Card -->
      <g transform="translate(48, 26)">
        <rect width="480" height="92" rx="10" fill="url(#botEmbed)" stroke="#1db954" stroke-opacity="0.5" stroke-width="1.2" filter="url(#softShadow)"/>
        <!-- Disc icon -->
        <circle cx="46" cy="46" r="28" fill="#08140c" stroke="#1ed760" stroke-width="1.5"/>
        <circle cx="46" cy="46" r="10" fill="#122a1a"/>
        <circle cx="46" cy="46" r="3" fill="#1ed760"/>
        
        <!-- Track info -->
        <text x="88" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#1ed760" letter-spacing="0.5">🎶 ŞU ANDA ÇALIYOR</text>
        <text x="88" y="52" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Never Gonna Give You Up (4K Remaster)</text>
        <text x="88" y="70" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#9da7ca">Rick Astley • İsteyen: <tspan fill="#ffffff" font-weight="600">admin</tspan></text>
        
        <!-- Animated wave bars -->
        <g transform="translate(410, 46)">
          <rect x="0" y="-12" width="3" height="24" rx="1.5" fill="url(#musicWave)"/>
          <rect x="6" y="-20" width="3" height="40" rx="1.5" fill="url(#musicWave)"/>
          <rect x="12" y="-8" width="3" height="16" rx="1.5" fill="url(#musicWave)"/>
          <rect x="18" y="-16" width="3" height="32" rx="1.5" fill="url(#musicWave)"/>
          <rect x="24" y="-22" width="3" height="44" rx="1.5" fill="url(#musicWave)"/>
          <rect x="30" y="-10" width="3" height="20" rx="1.5" fill="url(#musicWave)"/>
          <rect x="36" y="-14" width="3" height="28" rx="1.5" fill="url(#musicWave)"/>
        </g>
      </g>
    </g>

    <!-- Message 3: Command pause -->
    <g transform="translate(24, 276)">
      <circle cx="20" cy="18" r="18" fill="#5865f2"/>
      <text x="20" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">A</text>
      <text x="48" y="14" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">admin</text>
      <text x="96" y="14" font-family="-apple-system, sans-serif" font-size="11" fill="#626b89">Bugün 14:35</text>
      <rect x="48" y="22" width="94" height="26" rx="6" fill="#181a26"/>
      <text x="58" y="39" font-family="'Fira Code', monospace" font-size="12" fill="#00d2ff">!duraklat</text>
    </g>

    <!-- Message 4: Bot response -->
    <g transform="translate(24, 332)">
      <circle cx="20" cy="18" r="18" fill="#1db954"/>
      <text x="20" y="23" font-family="-apple-system, sans-serif" font-size="14" fill="#fff" text-anchor="middle">🎵</text>
      <text x="48" y="14" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Müzik Botu</text>
      <rect x="130" y="3" width="28" height="14" rx="4" fill="#1db954" fill-opacity="0.25"/>
      <text x="144" y="13" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#1ed760" text-anchor="middle">BOT</text>
      <text x="48" y="38" font-family="-apple-system, sans-serif" font-size="13" fill="#ffcf85">⏸ Duraklatıldı. Devam etmek için: !devam</text>
    </g>

    <!-- Chat Input Box -->
    <g transform="translate(24, 460)">
      <rect width="712" height="46" rx="8" fill="#1a1c27" stroke="#25293d" stroke-width="1.2"/>
      <circle cx="24" cy="23" r="12" fill="#292e42"/>
      <text x="24" y="28" font-family="-apple-system, sans-serif" font-size="16" fill="#8a95b8" text-anchor="middle">+</text>
      <text x="48" y="28" font-family="-apple-system, sans-serif" font-size="13" fill="#626b89">#genel kanalına mesaj gönder veya !komut yaz...</text>
      <text x="680" y="28" font-family="-apple-system, sans-serif" font-size="15" fill="#8a95b8">😀</text>
    </g>

    <!-- ==================== BOTTOM VOICEBAR (IN-CALL CONTROLS) ==================== -->
    <g transform="translate(0, 524)">
      <!-- Voicebar container -->
      <rect width="760" height="134" fill="#0d0e15" stroke="#1d2030" stroke-width="1"/>
      
      <!-- Voice Top Status -->
      <g transform="translate(24, 18)">
        <circle cx="8" cy="8" r="5" fill="#1ed760"/>
        <text x="20" y="12" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">🔊 Bot odası</text>
        <text x="110" y="12" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#7582a8">(2 kişi bağlı • WebRTC SFU • 48 kHz Opus)</text>
      </g>

      <!-- Control Action Buttons -->
      <g transform="translate(24, 48)">
        <!-- Mic Button (ON - Green) -->
        <g transform="translate(0, 0)">
          <rect width="118" height="44" rx="8" fill="#1db954" stroke="#1ed760" stroke-width="1"/>
          <text x="20" y="27" font-family="-apple-system, sans-serif" font-size="15">🎙️</text>
          <text x="44" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Mikrofon</text>
        </g>

        <!-- Deafen (Sağırlaştır) Button (Highlighted Feature!) -->
        <g transform="translate(126, 0)">
          <rect width="128" height="44" rx="8" fill="#2b2f3a" stroke="#485166" stroke-width="1.2"/>
          <text x="18" y="27" font-family="-apple-system, sans-serif" font-size="15">🔇</text>
          <text x="42" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#b9c2d4">Sağırlaştır</text>
        </g>

        <!-- VAD / Push-to-Talk Button (Orange/Live) -->
        <g transform="translate(262, 0)">
          <rect width="144" height="44" rx="8" fill="#33291a" stroke="#5c4a2a" stroke-width="1"/>
          <circle cx="18" cy="22" r="4" fill="#ffbd2e"/>
          <text x="30" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffcf85">Ses algılama (VAD)</text>
        </g>

        <!-- Screen Share -->
        <g transform="translate(414, 0)">
          <rect width="90" height="44" rx="8" fill="#1a1c27" stroke="#25293d" stroke-width="1"/>
          <text x="16" y="27" font-family="-apple-system, sans-serif" font-size="14">🖥️</text>
          <text x="38" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#9da7ca">Ekran</text>
        </g>

        <!-- Camera -->
        <g transform="translate(512, 0)">
          <rect width="96" height="44" rx="8" fill="#1a1c27" stroke="#25293d" stroke-width="1"/>
          <text x="16" y="27" font-family="-apple-system, sans-serif" font-size="14">📹</text>
          <text x="40" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#9da7ca">Kamera</text>
        </g>

        <!-- Leave (Ayrıl) - Danger Red -->
        <g transform="translate(616, 0)">
          <rect width="90" height="44" rx="8" fill="#3a2226" stroke="#5b2f34" stroke-width="1"/>
          <text x="16" y="27" font-family="-apple-system, sans-serif" font-size="14">📞</text>
          <text x="38" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ff9a9d">Ayrıl</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT SIDEBAR: PARTICIPANTS ==================== -->
  <g transform="translate(1000, 42)">
    <rect width="200" height="658" fill="#11131c" stroke="#1d2133" stroke-width="1"/>
    
    <!-- Header -->
    <rect width="200" height="48" fill="#12131b" stroke="#1d2030" stroke-width="1"/>
    <text x="16" y="29" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#626b89" letter-spacing="0.5">ÜYELER — 2</text>

    <!-- User Item: admin -->
    <g transform="translate(12, 64)">
      <circle cx="16" cy="16" r="16" fill="#5865f2"/>
      <circle cx="16" cy="16" r="19" fill="none" stroke="#1ed760" stroke-width="2"/>
      <text x="16" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">A</text>
      <text x="44" y="16" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">admin</text>
      <text x="44" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#1ed760">Konuşuyor...</text>
    </g>

    <!-- User Item: Müzik Botu -->
    <g transform="translate(12, 120)">
      <circle cx="16" cy="16" r="16" fill="#1db954"/>
      <text x="16" y="21" font-family="-apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle">🎵</text>
      <text x="44" y="16" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Müzik Botu</text>
      <text x="44" y="30" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#9da7ca">Müzik çalıyor 🎶</text>
    </g>
  </g>
</svg>
